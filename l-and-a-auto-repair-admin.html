<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L & A Auto Repair Admin (demo)</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--abg:#0E141B;--aink:#EDF1F5;--amut:#98A4B1;--aline:rgba(237,241,245,.16);--apanel:#151D27;--acc:#F2711C;--onacc:#0E141B;--f1:'Barlow Condensed',sans-serif;--f2:'Barlow',sans-serif;--fw:700}
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 15px/1.55 var(--f2);background:var(--abg);color:var(--aink);min-height:100vh}
.gate{position:fixed;inset:0;background:var(--abg);display:flex;align-items:center;justify-content:center;z-index:9}
.gate form{width:min(380px,90vw);text-align:center}
.gate h1{font:var(--fw,500) 2rem var(--f1);margin-bottom:.4rem}
.gate p{color:var(--amut);margin-bottom:1.4rem;font-size:.9rem}
.gate input{width:100%;text-align:center;letter-spacing:.5em;font-size:1.6rem;padding:.8rem;border:1px solid var(--aline);background:transparent;color:inherit;border-radius:6px;outline:none}
.gate input:focus{border-color:var(--acc)}
.gate button{margin-top:1rem;width:100%;padding:.95rem;border:0;border-radius:6px;background:var(--acc);color:var(--onacc,#fff);font:600 .95rem var(--f2);cursor:pointer;min-height:48px}
.gate .bad{color:#e5604d;font-size:.85rem;margin-top:.7rem;min-height:1.2em}
.app{max-width:1180px;margin:0 auto;padding:28px 5vw 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:26px}
.top h1{font:var(--fw,500) 1.9rem var(--f1)}
.top small{color:var(--amut);display:block;font:500 .78rem var(--f2);letter-spacing:.14em;text-transform:uppercase}
.top a,.top button{font:600 .85rem var(--f2);border:1px solid var(--aline);background:transparent;color:inherit;padding:.65rem 1rem;border-radius:6px;cursor:pointer;min-height:42px;display:inline-block}
.banner{background:var(--apanel);border:1px dashed var(--acc);color:var(--aink);padding:.8rem 1rem;border-radius:6px;margin-bottom:20px;font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.k{background:var(--apanel);border:1px solid var(--aline);border-radius:8px;padding:18px}
.k span{font:600 .7rem var(--f2);letter-spacing:.14em;text-transform:uppercase;color:var(--amut)}
.k b{display:block;font:var(--fw,500) 2.3rem/1.1 var(--f1);margin-top:.35rem}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:.6rem 1rem;border:1px solid var(--aline);background:transparent;color:var(--amut);border-radius:999px;cursor:pointer;font:600 .82rem var(--f2);min-height:40px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}
.panel{background:var(--apanel);border:1px solid var(--aline);border-radius:8px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--aline);font-size:.92rem;vertical-align:top}
th{font:600 .7rem var(--f2);letter-spacing:.14em;text-transform:uppercase;color:var(--amut)}
tr:last-child td{border-bottom:0}
select.st{background:transparent;color:inherit;border:1px solid var(--aline);border-radius:6px;padding:.35rem .5rem;font:inherit}
select.st option{color:#111}
.sample td{opacity:.62}
.list{padding:6px 18px}
.list li{list-style:none;display:flex;justify-content:space-between;gap:1rem;padding:13px 0;border-bottom:1px solid var(--aline)}
.list li:last-child{border:0}
.list li span:last-child{color:var(--amut);text-align:right}
.x{background:transparent;border:0;color:var(--amut);cursor:pointer;font-size:1.1rem;min-width:36px;min-height:36px}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="gate" id="gate"><form id="pf"><h1>L & A Auto Repair</h1><p>Admin demo. Enter the PIN to continue.</p><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN"><button type="submit">Open dashboard</button><div class="bad" id="pbad"></div></form></div>
<div class="app" id="app" hidden>
<div class="top"><div><small>L & A Auto Repair &middot; Visit requests</small><h1>L & A Auto Repair</h1></div><div><a href="l-and-a-auto-repair-demo.html">View demo site</a> <button id="clr">Clear requests</button></div></div>
<div class="banner" id="bn" hidden>Sample data. Submit a request on the demo site and it appears here live.</div>
<div class="kpis"><div class="k"><span>Requests</span><b id="k1">0</b></div><div class="k"><span>New</span><b id="k2">0</b></div><div class="k"><span>This week</span><b id="k3">0</b></div><div class="k"><span>Top service</span><b id="k4">0</b></div></div>
<div class="tabs"><button class="on" data-t="req">Visit requests</button><button data-t="svc">Services</button><button data-t="hrs">Hours</button></div>
<div class="panel" id="p-req"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
<div class="panel list" id="p-svc" hidden><ul id="sv"></ul></div>
<div class="panel list" id="p-hrs" hidden><ul id="hr"></ul></div>
</div>
<script>
var CFG={"slug": "l-and-a-auto-repair", "cols": [["name", "Name"], ["phone", "Phone"], ["vehicle", "Vehicle"], ["service", "Service"], ["day", "Day"], ["note", "Notes"]], "seed": [{"name": "Sample: Ray M.", "phone": "(215) 555-0120", "vehicle": "2016 Honda Accord", "service": "State inspection", "day": "Friday", "note": "Sample row.", "status": "new"}, {"name": "Sample: Lena V.", "phone": "(215) 555-0145", "vehicle": "2013 Ford Escape", "service": "Brakes", "day": "Saturday", "note": "Sample row.", "status": "confirmed"}, {"name": "Sample: Tom B.", "phone": "(215) 555-0190", "vehicle": "2019 Toyota Camry", "service": "Oil change", "day": "Thursday", "note": "Sample row.", "status": "done"}], "kseed": ["36", "5", "11", "State inspection"], "svc": [["State inspection", "Price added once owner confirms"], ["Oil change", "Price added once owner confirms"], ["Brakes", "Price added once owner confirms"], ["Tires", "Price added once owner confirms"], ["Belts", "Price added once owner confirms"]], "hours": [["Mon \u2013 Fri", "8 AM \u2013 5 PM"], ["Saturday", "8 AM \u2013 2 PM"], ["Sunday", "Closed"]],"k4":function(r){var c={},b='',n=0;r.forEach(function(x){var k=x.service||'';c[k]=(c[k]||0)+1;if(c[k]>n){n=c[k];b=k}});return b||'-'}};
var KEY=CFG.slug+'_bookings';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmtD(iso){try{var d=new Date(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}catch(e){return ''}}
function render(){
 var a=load(),sample=false;
 if(!a.length){a=CFG.seed.map(function(r,i){var o=Object.assign({},r);o.id='s'+i;o.created=new Date(Date.now()-i*86400000*0.7).toISOString();o.sample=true;return o});sample=true}
 document.getElementById('bn').hidden=!sample;
 document.getElementById('th').innerHTML='<th>Received</th>'+CFG.cols.map(function(c){return '<th>'+esc(c[1])+'</th>'}).join('')+'<th>Status</th><th></th>';
 document.getElementById('tb').innerHTML=a.map(function(r){
  return '<tr class="'+(r.sample?'sample':'')+'"><td>'+fmtD(r.created)+'</td>'+CFG.cols.map(function(c){return '<td>'+esc(r[c[0]])+'</td>'}).join('')+
  '<td><select class="st" data-id="'+esc(r.id)+'" '+(r.sample?'disabled':'')+'>'+['new','confirmed','done'].map(function(s){return '<option'+(r.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td>'+
  '<td>'+(r.sample?'':'<button class="x" data-del="'+esc(r.id)+'" aria-label="Delete">&times;</button>')+'</td></tr>'}).join('');
 var real=sample?[]:a,wk=Date.now()-7*86400000;
 document.getElementById('k1').textContent=sample?CFG.kseed[0]:real.length;
 document.getElementById('k2').textContent=sample?CFG.kseed[1]:real.filter(function(r){return r.status==='new'}).length;
 document.getElementById('k3').textContent=sample?CFG.kseed[2]:real.filter(function(r){return new Date(r.created).getTime()>wk}).length;
 document.getElementById('k4').textContent=sample?CFG.kseed[3]:CFG.k4(real);
}
document.getElementById('tb').addEventListener('change',function(e){var t=e.target;if(!t.dataset.id)return;var a=load();a.forEach(function(r){if(r.id===t.dataset.id)r.status=t.value});save(a);render()});
document.getElementById('tb').addEventListener('click',function(e){var id=e.target.dataset&&e.target.dataset.del;if(!id)return;save(load().filter(function(r){return r.id!==id}));render()});
document.getElementById('clr').addEventListener('click',function(){save([]);render()});
document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});['req','svc','hrs'].forEach(function(k){document.getElementById('p-'+k).hidden=(k!==b.dataset.t)})})});
document.getElementById('sv').innerHTML=CFG.svc.map(function(s){return '<li><span>'+esc(s[0])+'</span><span>'+esc(s[1])+'</span></li>'}).join('');
document.getElementById('hr').innerHTML=CFG.hours.map(function(s){return '<li><span>'+esc(s[0])+'</span><span>'+esc(s[1])+'</span></li>'}).join('');
document.getElementById('pf').addEventListener('submit',function(e){e.preventDefault();if(document.getElementById('pin').value==='1234'){document.getElementById('gate').style.display='none';document.getElementById('app').hidden=false;render()}else{document.getElementById('pbad').textContent='Wrong PIN. Demo PIN is 1234.';document.getElementById('pin').value=''}});
</script></body></html>
