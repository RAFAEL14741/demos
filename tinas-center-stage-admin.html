<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tina's Center Stage — Admin</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,0..100&family=Fredoka:wght@400;500;600&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff8f1;--sf:#fff;--tx:#111a35;--mu:#4e5877;--ac:#b8455f;--rose:#f0a0b2;--blush:#fbd3da;--peach:#ffd9bf;--butter:#fff0b3;--sky:#d3ebf6;--nav:#111a35;--ln:rgba(17,26,53,.13);--rln:rgba(240,160,178,.75);--f1:'Fraunces',Georgia,serif;--f2:'Jost',system-ui,sans-serif;--f3:'Great Vibes','Segoe Script',cursive;--f4:'Fredoka','Trebuchet MS',sans-serif}
body{font-family:var(--f2);font-weight:300;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--nav)}
.lb{background:var(--bg);border-radius:26px;padding:44px 36px;width:min(92vw,380px);text-align:center;position:relative}
.lb::before{content:"";position:absolute;inset:9px;border:1px solid var(--rln);border-radius:19px;pointer-events:none}
.lg{font-family:var(--f3);font-size:2.8rem;color:var(--ac);line-height:1}
.ls{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mu);margin:10px 0 26px}
.pd{font-size:1.6rem;letter-spacing:10px;height:46px;margin-bottom:14px;color:var(--tx)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pb{border:1px solid var(--ln);background:#fff;border-radius:14px;padding:15px;font-size:1.1rem;min-height:48px;transition:.5s}
@media (hover:hover){.pb:hover{background:var(--blush)}}
.pb.w{grid-column:span 2}
.pe{background:var(--nav);color:var(--bg);width:100%;padding:15px;border-radius:40px;font-weight:400;font-size:.78rem;letter-spacing:.24em;min-height:48px}
.pr{color:#a03a3a;font-size:.85rem;height:20px;margin-top:10px}
.hint{color:var(--mu);font-size:.74rem;margin-top:8px}
#dash{display:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--nav);color:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--rose)}
.top .br{font-family:var(--f1);font-weight:600;font-size:1.3rem}
.top .r{display:flex;gap:14px;align-items:center;font-size:.82rem;color:var(--rose)}
.sm{border:1px solid rgba(250,246,239,.35);border-radius:30px;padding:8px 18px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);transition:.5s;min-height:40px}
@media (hover:hover){.sm:hover{background:var(--rose);color:var(--nav)}}
.wrap{max-width:1180px;margin:0 auto;padding:36px 24px 80px}
h1{font-family:var(--f3);font-size:3.4rem;font-weight:400;color:var(--ac);line-height:1.1}
.sub{color:var(--mu);font-size:.9rem;margin:2px 0 28px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.k{background:var(--sf);border:1px solid var(--rln);border-radius:20px;padding:20px 22px}
.k small{font-size:.64rem;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--ac)}
.k b{display:block;font-variant-numeric:lining-nums;font-family:var(--f1);font-size:3rem;font-weight:500;line-height:1.1;margin-top:6px}
.g{display:grid;grid-template-columns:2fr 1fr;gap:20px}.g>*{min-width:0}
.c{background:var(--sf);border:1px solid var(--rln);border-radius:22px;padding:22px;margin-bottom:20px}
.ct{display:flex;justify-content:space-between;align-items:center;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);margin-bottom:14px;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--ln);border-radius:30px;padding:7px 15px;font-weight:400;font-size:.72rem;letter-spacing:.04em;text-transform:none;color:var(--tx);min-height:36px}
.tabs button.on{background:var(--nav);color:var(--bg);border-color:var(--nav)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);font-weight:400}
td{padding:12px 10px;border-bottom:1px solid var(--ln);font-size:.9rem;vertical-align:top}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--mu);font-size:.76rem;margin-top:2px}
select.st{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font:inherit;font-size:.76rem}
.tag{display:inline-block;padding:2px 12px;border-radius:20px;font-size:.72rem;border:1px solid var(--rose);background:var(--blush);color:var(--ac);margin-bottom:3px}
.x{color:var(--mu);font-size:1rem;padding:6px 10px}.x:hover{color:#a03a3a}
.empty{color:var(--mu);font-size:.9rem;padding:26px 0;text-align:center}
.banner{background:var(--blush);border:1px dashed var(--rose);border-radius:12px;padding:10px 14px;font-size:.8rem;color:var(--ac);margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);font-size:.9rem;gap:10px}
.row:last-child{border:0}.row .p{color:var(--ac);font-weight:400}
.row input{background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:7px 10px;font:inherit;font-size:.84rem;width:130px}
.row.t b{font-weight:500}
@media(max-width:820px){.kp{grid-template-columns:repeat(2,1fr)}.g{grid-template-columns:1fr}.top .r span{display:none}h1{font-size:2.8rem}.wrap{padding:28px 16px 60px}}

/* cute layer */
body{font-weight:400}
#login{background:var(--blush)}
.lb{border-radius:44px;border:5px solid #fff;box-shadow:0 30px 60px -30px rgba(184,69,95,.5),0 8px 0 rgba(17,26,53,.07)}
.lb::before{border:3px dashed var(--rose);border-radius:34px}
.ls,.k small,.ct,th,.tabs button,.sm,.pe,.tag,.hint{font-family:var(--f4)}
.ls,.k small,.ct{font-weight:500;letter-spacing:.14em}
.pb{border-radius:22px;border:2px solid var(--ln);box-shadow:0 3px 0 rgba(17,26,53,.08)}
.pe{box-shadow:0 5px 0 rgba(17,26,53,.18);letter-spacing:.08em;font-size:.95rem;text-transform:none}
.top{border-bottom:4px solid var(--rose)}
.top .br{font-family:var(--f1);font-variation-settings:"SOFT" 100;font-weight:700}
.top .r{color:var(--blush)}
.k{border:0;border-radius:32px;box-shadow:0 6px 0 rgba(17,26,53,.07)}
.k:nth-child(4n+1){background:var(--blush)}.k:nth-child(4n+2){background:var(--peach)}.k:nth-child(4n+3){background:var(--butter)}.k:nth-child(4n){background:var(--sky)}
.k b{font-family:var(--f1);font-variation-settings:"SOFT" 100;font-weight:600}
.c{border:3px dashed var(--rose);border-radius:36px;background:#fff}
.tabs button{border:2px solid var(--ln);background:var(--bg)}
.tabs button.on{background:var(--rose);color:var(--tx);border-color:var(--tx)}
.tag{background:var(--blush);border:2px dashed var(--rose)}
select.st{border-radius:22px;border:2px solid var(--ln)}
.banner{border:2px dashed var(--rose);border-radius:22px}
.row input{border-radius:16px}
h1{font-size:3.6rem}
</style></head><body>
<div id="login"><div class="lb"><div class="lg">Tina's Center Stage</div><div class="ls">Studio access</div><div class="pd" id="pd">· · · ·</div>
<div class="pg"><button class="pb" data-d="1">1</button><button class="pb" data-d="2">2</button><button class="pb" data-d="3">3</button><button class="pb" data-d="4">4</button><button class="pb" data-d="5">5</button><button class="pb" data-d="6">6</button><button class="pb" data-d="7">7</button><button class="pb" data-d="8">8</button><button class="pb" data-d="9">9</button><button class="pb w" id="clr">Clear</button><button class="pb" data-d="0">0</button></div>
<button class="pe" id="ent">ENTER →</button><div class="pr" id="pr"></div><div class="hint">Demo PIN: 1234</div></div></div>
<div id="dash">
<div class="top"><div class="br">Tina's Center Stage — Admin</div><div class="r"><span id="dt"></span><button class="sm" id="csv">Export CSV</button><button class="sm" id="out">Log out</button></div></div>
<div class="wrap"><h1>Dashboard</h1><div class="sub">Registration &amp; interest requests from the website</div>
<div class="kp"><div class="k"><small>New requests</small><b id="k1">0</b></div><div class="k"><small>Contacted</small><b id="k2">0</b></div><div class="k"><small>Total</small><b id="k3">0</b></div><div class="k"><small>Party &amp; camp</small><b id="k4">0</b></div></div>
<div class="g"><div><div class="c"><div class="ct"><span>Requests</span><div class="tabs" id="tabs"></div></div><div id="ban"></div><div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div><div class="empty" id="em" style="display:none">Nothing here yet.</div></div></div>
<div><div class="c"><div class="ct">Studio hours</div><div id="hrs"></div><div class="hint" style="margin-top:8px">Edits save on this device (demo).</div></div><div class="c"><div class="ct">Programs (set tuition)</div><div id="svc"></div></div></div></div></div></div>
<script>
var CFG={"tabKey":"interest","tabs":["Weekly classes","Birthday party","Summer camp","Not sure"],"status":["new","contacted","enrolled","not now","cancelled"],"cols":[["Dancer & parent","dancer"],["Interest","interest"],["Contact time","contactTime"]],"fmt":{"dancer":"fN","interest":"fS","contactTime":"fD"},"k4":"k4","hours":[["Class days","Miss Tina adds"],["Class times","Miss Tina adds"]],"svc":[["Weekly combination classes","Set tuition"],["Themed birthday parties","Set price"],["Summer camps","Set price"]],"seed":[{"dancer":"Sample: Ava M. (age 4)","age":4,"parent":"Sample Parent","phone":"(215) 555-0133","interest":"Weekly classes","contactTime":"Weekdays after 4pm","status":"new"},{"dancer":"Sample: Sofia L. (age 7)","age":7,"parent":"Sample Parent","phone":"(267) 555-0278","interest":"Birthday party","contactTime":"Any evening","status":"contacted"},{"dancer":"Sample: Leo R. (age 5)","age":5,"parent":"Sample Parent","phone":"(215) 555-0319","interest":"Summer camp","contactTime":"Saturday morning","status":"new"},{"dancer":"Sample: Mia T. (age 9)","age":9,"parent":"Sample Parent","phone":"(215) 555-0445","interest":"Not sure","contactTime":"Text me first","status":"new"}],"slug":"tinas-center-stage"};
var $=function(s){return document.querySelector(s)};
var pin='',KEY=CFG.slug+'_bookings',HK=CFG.slug+'_hours',filt='all';
function upd(){$('#pd').textContent=pin?('● '.repeat(pin.length)).trim():'· · · ·'}
document.querySelectorAll('.pb[data-d]').forEach(function(b){b.onclick=function(){if(pin.length<4){pin+=b.dataset.d;upd()}}});
$('#clr').onclick=function(){pin='';upd();$('#pr').textContent=''};
function chk(){if(pin==='1234'){$('#login').style.display='none';$('#dash').style.display='block';boot()}else{$('#pr').textContent='Incorrect PIN.';pin='';upd()}}
$('#ent').onclick=chk;
document.addEventListener('keydown',function(e){if($('#login').style.display==='none')return;if(e.key>='0'&&e.key<='9'&&pin.length<4){pin+=e.key;upd()}if(e.key==='Enter')chk();if(e.key==='Backspace'){pin=pin.slice(0,-1);upd()}});
$('#out').onclick=function(){$('#dash').style.display='none';$('#login').style.display='flex';pin='';upd()};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmtD(iso){if(!iso)return'';var d=new Date(iso.length===10?iso+'T12:00:00':iso);return isNaN(d)?iso:d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function render(){
  var real=load(),seed=!real.length,rows=seed?CFG.seed.map(function(r,i){var o=JSON.parse(JSON.stringify(r));o.id='S'+i;o._s=1;return o}):real;
  $('#ban').innerHTML=seed?'<div class="banner">Sample data — submit a request on the demo site and it appears here live.</div>':'';
  var tabs=['all'].concat(CFG.tabs);$('#tabs').innerHTML=tabs.map(function(t){return '<button class="'+(t===filt?'on':'')+'" data-t="'+esc(t)+'">'+esc(t==='all'?'All':t)+'</button>'}).join('');
  document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){filt=b.dataset.t;render()}});
  var vis=rows.filter(function(r){return filt==='all'||r[CFG.tabKey]===filt});
  $('#th').innerHTML=CFG.cols.map(function(c){return '<th>'+c[0]+'</th>'}).join('')+'<th>Status</th><th></th>';
  $('#tb').innerHTML=vis.map(function(r){
    return '<tr>'+CFG.cols.map(function(c){var v=CFG.fmt&&CFG.fmt[c[1]]?window[CFG.fmt[c[1]]](r):esc(r[c[1]]);return '<td>'+v+'</td>'}).join('')+
    '<td><select class="st" data-id="'+esc(r.id)+'">'+CFG.status.map(function(s){return '<option'+(s===r.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td><td>'+(r._s?'':'<button class="x" data-del="'+esc(r.id)+'" title="Delete">✕</button>')+'</td></tr>'}).join('');
  $('#em').style.display=vis.length?'none':'block';
  document.querySelectorAll('select.st').forEach(function(s){s.onchange=function(){if(s.dataset.id[0]==='S'&&/^S\d+$/.test(s.dataset.id)&&seed){var a=CFG.seed.map(function(r,i){var o=JSON.parse(JSON.stringify(r));o.id='S'+i;return o});a.forEach(function(o){if(o.id===s.dataset.id)o.status=s.value});save(a)}else{var a=load();a.forEach(function(o){if(o.id===s.dataset.id)o.status=s.value});save(a)}render()}});
  document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){save(load().filter(function(o){return o.id!==b.dataset.del}));render()}});
  var n=rows.filter(function(r){return r.status===CFG.status[0]}).length,cf=rows.filter(function(r){return r.status===CFG.status[1]}).length;
  $('#k1').textContent=n;$('#k2').textContent=cf;$('#k3').textContent=rows.length;$('#k4').textContent=CFG.k4?window[CFG.k4](rows):0;
}
function hours(){
  var h;try{h=JSON.parse(localStorage.getItem(HK)||'null')}catch(e){}h=h||CFG.hours;
  $('#hrs').innerHTML=h.map(function(r,i){return '<div class="row"><span>'+esc(r[0])+'</span><input data-h="'+i+'" value="'+esc(r[1])+'"></div>'}).join('');
  document.querySelectorAll('[data-h]').forEach(function(inp){inp.onchange=function(){h[+inp.dataset.h][1]=inp.value;try{localStorage.setItem(HK,JSON.stringify(h))}catch(e){}}});
}
function svcs(){$('#svc').innerHTML=CFG.svc.map(function(r){return '<div class="row"><span>'+esc(r[0])+'</span><span class="p">'+esc(r[1])+'</span></div>'}).join('')}
$('#csv').onclick=function(){var a=load();if(!a.length){a=CFG.seed}var keys=Object.keys(a[0]).filter(function(k){return k[0]!=='_'});var csv=[keys.join(',')].concat(a.map(function(r){return keys.map(function(k){return '"'+String(r[k]==null?'':(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])).replace(/"/g,'""')+'"'}).join(',')})).join('\n');var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));l.download=CFG.slug+'-requests.csv';l.click()};
function boot(){$('#dt').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});render();hours();svcs()}
function fN(r){return esc(r.dancer)+'<small>Parent: '+esc(r.parent)+' &middot; '+esc(r.phone)+'</small>'}function fS(r){return '<span class="tag">'+esc(r.interest)+'</span>'}function fD(r){return r.contactTime?esc(r.contactTime):'<small>&mdash;</small>'}function k4(rows){return rows.filter(function(r){return r.interest==='Birthday party'||r.interest==='Summer camp'}).length}
</script></body></html>
